# Builds every app in this repository and, on a tag, publishes them as a
# GitHub release, so a check or a CI job can install an app under test
# without building it: `gh release download -R mobiumdev/mobium-app`, or
# https://github.com/mobiumdev/mobium-app/releases/latest/download/<file>.
#
# The file names do not carry the version, so that latest/download URL
# stays the same from release to release. Android builds are signed with a
# debug key and iOS and tvOS builds are for the simulator, unsigned: these
# are apps under test, never published to a store. The Flutter app's iOS
# build is a debug build, since Flutter builds nothing else for a simulator.
#
# It is also the repository's CI: every pull request and every push to main
# builds everything and publishes nothing, so a change that breaks a build
# or a unit test fails before it is merged rather than at the next tag. A
# failure on main opens an issue (failure-issue.yml).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's earlier run is superseded by its newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The repository's one static check (CLAUDE.md).
      - run: npx tsc --noEmit

  mobiumapp-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - run: ./gradlew --no-daemon assembleRelease
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk MobiumApp-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: MobiumApp-android
          path: MobiumApp-android.apk

  mobiumapp-ios:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios
        env:
          CI: 1
      - run: >
          xcodebuild -workspace ios/MobiumApp.xcworkspace -scheme MobiumApp
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO build -quiet
      - run: ditto -c -k --keepParent ios/build/Build/Products/Release-iphonesimulator/MobiumApp.app MobiumApp-ios-simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: MobiumApp-ios-simulator
          path: MobiumApp-ios-simulator.zip

  mobiumtv-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon assembleRelease
        working-directory: tv
      - run: cp tv/app/build/outputs/apk/release/app-release.apk MobiumTV-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: MobiumTV-android
          path: MobiumTV-android.apk

  mobiumtv-tvos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: >
          xcodebuild -project MobiumTV.xcodeproj -scheme MobiumTV -configuration Release
          -destination 'generic/platform=tvOS Simulator' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build -quiet
        working-directory: tvos
      - run: ditto -c -k --keepParent tvos/build/Build/Products/Release-appletvsimulator/MobiumTV.app MobiumTV-tvos-simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: MobiumTV-tvos-simulator
          path: MobiumTV-tvos-simulator.zip

  flutter:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: flutter build apk --release
        working-directory: flutter
      - run: flutter build ios --simulator
        working-directory: flutter
      - run: |
          cp flutter/build/app/outputs/flutter-apk/app-release.apk MobiumFlutter-android.apk
          ditto -c -k --keepParent flutter/build/ios/iphonesimulator/Runner.app MobiumFlutter-ios-simulator-debug.zip
      - uses: actions/upload-artifact@v5
        with:
          name: MobiumFlutter
          path: |
            MobiumFlutter-android.apk
            MobiumFlutter-ios-simulator-debug.zip

  appclip:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: >
          xcodebuild -project MobiumClipDemo.xcodeproj -scheme ClipDemo -configuration Release
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build -quiet
        working-directory: appclip
      - run: ditto -c -k --keepParent appclip/build/Build/Products/Release-iphonesimulator/ClipDemo.app MobiumClipDemo-ios-simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: MobiumClipDemo-ios-simulator
          path: MobiumClipDemo-ios-simulator.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [typecheck, mobiumapp-android, mobiumapp-ios, mobiumtv-android, mobiumtv-tvos, flutter, appclip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum -- * > SHA256SUMS
        working-directory: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MobiumApp $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
