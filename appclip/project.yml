# An App Clip and the app it belongs to, for driving App Clips with Mobium.
# Generate the project with `xcodegen` after editing this file; the generated
# MobiumClipDemo.xcodeproj is committed, so building needs only Xcode.
name: MobiumClipDemo
options:
  bundleIdPrefix: dev.mobium
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ClipDemo:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobium.clipdemo
        INFOPLIST_KEY_CFBundleDisplayName: Clip Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Host/ClipDemo.entitlements
    dependencies:
      - target: ClipDemoClip
        embed: true
  ClipDemoClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Clip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobium.clipdemo.Clip
        INFOPLIST_KEY_CFBundleDisplayName: Clip Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Clip/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Clip/ClipDemoClip.entitlements
